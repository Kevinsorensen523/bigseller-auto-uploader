name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + build deps
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Download Chromium for bundling
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium

      - name: Locate bundled Chromium folder
        id: browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          $pkgDir = python -c "import playwright, os; print(os.path.dirname(playwright.__file__))"
          $browsersDir = Get-ChildItem -Path $pkgDir -Recurse -Directory -Filter ".local-browsers" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $browsersDir) { throw "Folder .local-browsers tidak ketemu setelah playwright install chromium" }
          "pkgDir=$pkgDir" >> $env:GITHUB_OUTPUT
          "browsersDir=$browsersDir" >> $env:GITHUB_OUTPUT

      - name: Build exe with PyInstaller
        run: |
          pyinstaller run_ui.py `
            --name bigseller-uploader `
            --onedir `
            --noconfirm `
            --add-data "bigseller_auto_uploader/templates;bigseller_auto_uploader/templates" `
            --add-data "${{ steps.browsers.outputs.browsersDir }};playwright/driver/package/.local-browsers" `
            --collect-all playwright

      - name: Copy .env.example and data folder skeleton
        run: |
          Copy-Item .env.example dist/bigseller-uploader/.env.example
          New-Item -ItemType Directory -Force -Path dist/bigseller-uploader/data/images | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bigseller-uploader/jobs/pending | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bigseller-uploader/jobs/done | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bigseller-uploader/jobs/failed | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bigseller-uploader/jobs/skipped | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: bigseller-uploader-windows
          path: dist/bigseller-uploader/
          retention-days: 30
